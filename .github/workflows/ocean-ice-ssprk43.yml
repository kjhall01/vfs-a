name: Ocean ice SSPRK43 candidate

on:
  push:
    branches:
      - experiment/ssprk43-ocean-ice-20261123
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-and-throughput:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact CPU PyTorch wheel and VFS tests
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install 'gsw==3.6.23'
          python -m pip install --no-deps -r workflows/pyam21/requirements.txt
          python -m pip check
      - name: Coupled ocean ice tableau and conservation regressions
        run: python -I -m pytest tests/ocean/test_ocean_ice_ssprk43.py -q -rA
      - name: Actual dynamics, matched model-time 256 x 8
        run: |
          python -I validation/sea_ice/benchmark_ssprk43.py --cells 256 --layers 8 --dt 600 --threads 4 --warmups 1 --repeats 3 --output benchmark-256x8.json
      - name: Actual dynamics, matched model-time 1024 x 16
        run: |
          python -I validation/sea_ice/benchmark_ssprk43.py --cells 1024 --layers 16 --dt 600 --threads 4 --warmups 1 --repeats 3 --output benchmark-1024x16.json
      - name: Actual dynamics, matched model-time 4096 x 40
        run: |
          python -I validation/sea_ice/benchmark_ssprk43.py --cells 4096 --layers 40 --dt 600 --threads 4 --warmups 1 --repeats 3 --output benchmark-4096x40.json
      - name: Upload measured dynamical cost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssprk43-dynamics-cost
          path: benchmark-*.json
