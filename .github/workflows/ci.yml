name: Installed wheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        id: install
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          python -m pip install --prefer-binary "${wheels[0]}[test]"
          python -m pip check
          mkdir -p "$RUNNER_TEMP/vfs-check"
          cp -R tests tools examples "$RUNNER_TEMP/vfs-check/"
      - name: Verify installed import and record environment
        working-directory: ${{ runner.temp }}/vfs-check
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path
          import platform
          import sysconfig
          import torch
          import vfs
          source = Path(vfs.__file__).resolve()
          assert source.is_relative_to(Path(sysconfig.get_path("purelib")).resolve()), source
          assert not source.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve()), source
          assert str(torch.__version__) == "2.15.0+cpu"
          print(platform.platform(), platform.python_version(), torch.__version__, source)
          PY
          python -m pip freeze
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I -m pytest tests -q --junitxml=pytest.xml
      - name: Checkpoint-54 exact comparison
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_baseline.py --report baseline.json
      - name: Dry helpers exact comparison
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_dry_helpers.py --report dry-helpers.json
      - name: MoistAtmosphere smoke test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I examples/moist_atmosphere.py
      - name: Save comparison reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-checks
          path: |
            ${{ runner.temp }}/vfs-check/pytest.xml
            ${{ runner.temp }}/vfs-check/baseline.json
            ${{ runner.temp }}/vfs-check/dry-helpers.json
          if-no-files-found: warn
