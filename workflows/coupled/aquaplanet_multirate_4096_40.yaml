# Experimental fresh-run 3-degree (4096 Voronoi cells) 40-layer coupled aquaplanet.
# Based on the 30-day float64 CPU campaign. Requires separate saved mesh and
# SeaEsfRad tables. Not an audited compatible restart of earlier trajectories.
# Initial pilot keeps SSPRK3 in both components; the ocean SSPRK43 candidate is
# available separately via ocean_dynamics_integrator: ssprk43, ocean_dt: 1200.
days: 30
start_year: 2001
cells: 4096
atmosphere_levels: 32
atmosphere_top_pa: 100.0
ocean_levels: 40
ocean_depth_m: 5000.0
top_layer_m: 10.0
lloyd_iterations: 0

# Four 600-s atmosphere and ocean steps per atomic 2400-s physics/exchange.
# AM2 vertical diffusion, RAS, clouds, precipitation and reciprocal surface
# transfer remain one indivisible conservative transaction.
physics_dt: 2400
atmosphere_dt: 600
ocean_dt: 600
ocean_dynamics_integrator: ssprk3
# Independent ocean operator cadences, each dividing physics_dt.
mixing_dt: 1200
mesoscale_dt: 1200
# ALE and full optics run every 2 hours, separately from physics/exchange.
ale_dt: 7200
radiation_dt: 7200

solar_constant: 1361.0
obliquity_degrees: 23.44
eccentricity: 0.01671
ice_temperature_K: 265.0

# Physical parameter settings retained from the 40-level reference run.
mixing_length_m: 2.0
mixing_substeps: 5
gm_redi: true
gm_energy_scheme: funded_donor_parcel
gm_length_m: 10000.0
gm_efficiency: 0.1
gm_kinetic_fraction: 0.5
redi_diffusivity_m2_s: 100.0
redi_positive_transport: true
eddy_initial_energy_J_kg: 0.1
eddy_substeps: 2
eddy_dissipation: true
eddy_decay_days: 30.0
backscatter: true
backscatter_viscosity_m2_s: 10000.0
backscatter_days: 1.0
backscatter_fraction: 0.25
biharmonic_viscosity_m4_s: 10000000000000.0
ale_remap: true

threads: 4
compile: true
device: cpu
dtype: float64
diagnostic_hours: 6
restart_days: 1
