name: Ocean temperature validation deduplication

on:
  push:
    branches:
      - perf/ocean-temperature-validation-dedup-20261123
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numeric dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install gsw==3.6.23
          python -m pip install --no-deps -r workflows/pyam21/requirements.txt
          python -m pip check
      - name: Verify original checks, exact coupled state, and fewer caloric evaluations
        run: |
          python -I -m pytest tests/test_ocean_rhs_profile.py -q -rA
          python -I -m pytest tests/ocean/test_ocean_ice_coupling.py tests/ocean/test_ocean_ice_ssprk43.py -q
