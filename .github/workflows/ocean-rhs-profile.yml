name: Ocean ice RHS detailed profile

on:
  push:
    branches:
      - perf/ocean-ice-rhs-breakdown-20261123
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install gsw==3.6.23
          python -m pip install --no-deps -r workflows/pyam21/requirements.txt
          python -m pip check
      - name: Verify same coupled trajectory and timing coverage
        run: python -I -m pytest tests/test_ocean_rhs_profile.py -q -rA
