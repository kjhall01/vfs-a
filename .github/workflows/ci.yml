name: Installed wheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        id: install
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          python -m pip install --prefer-binary "${wheels[0]}[test]"
          python -m pip check
          mkdir -p "$RUNNER_TEMP/vfs-check"
          cp -R tests tools examples "$RUNNER_TEMP/vfs-check/"
      - name: Verify installed import and record CPU/backend environment
        working-directory: ${{ runner.temp }}/vfs-check
        run: |
          python -I tools/record_environment.py --report environment.json --checkout "$GITHUB_WORKSPACE"
          python -I -c 'import torch; assert str(torch.__version__) == "2.15.0+cpu"'
          python -m pip freeze
      - name: Required portable pytest suite
        id: portable_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I -m pytest tests --fixture-mode=portable -q --junitxml=pytest-portable.xml
      - name: Required checkpoint-54 portable comparison
        id: portable_baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_baseline.py --mode portable --report baseline-portable.json
      - name: Required dry helpers portable comparison
        id: portable_dry
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_dry_helpers.py --mode portable --report dry-helpers-portable.json
      - name: Supported timestep smoke examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: |
          python -I examples/moist_atmosphere.py
          python -I examples/bounded_moist.py
          python -I examples/held_suarez.py
          python -I examples/dry_atmosphere.py
          python -I examples/dry_atmosphere.py --imex
          python -I examples/moist_atmosphere.py --imex
      - name: Held-Suarez pinned archive comparison
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_held_suarez_archive.py --archive-repo "$GITHUB_WORKSPACE" --report held-suarez.json
      - name: Verification infrastructure measurement (no scientific threshold)
        working-directory: ${{ runner.temp }}/vfs-check
        run: >-
          python -I tools/run_verification.py --repo "$GITHUB_WORKSPACE"
          --output verification-c1 --cells 16 64 256
      - name: Small energy derivative, work and actual-stage measurements
        working-directory: ${{ runner.temp }}/vfs-check
        run: >-
          python -I tools/run_energy_verification.py --repo "$GITHUB_WORKSPACE"
          --output verification-energy --cells 16 --levels 3 --dt 1
      - name: Exact fixture pytest (informational, failures retained)
        id: exact_tests
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: >-
          python -I -m pytest --fixture-mode=exact -q --junitxml=pytest-exact.xml
          tests/test_extraction.py::test_checkpoint54_fixture_equivalence_without_runtime_autograd
          tests/test_dry_extraction.py::test_expanded_dry_baseline
      - name: Checkpoint-54 exact comparison (informational)
        id: exact_baseline
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_baseline.py --mode exact --report baseline-exact.json
      - name: Dry helpers exact comparison (informational)
        id: exact_dry
        continue-on-error: true
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/vfs-check
        run: python -I tools/check_dry_helpers.py --mode exact --report dry-helpers-exact.json
      - name: Distinguish required portable and informational exact outcomes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          | Check | Portable (required) | Exact (informational) |
          | --- | --- | --- |
          | pytest | ${{ steps.portable_tests.outcome }} | ${{ steps.exact_tests.outcome }} |
          | checkpoint-54 | ${{ steps.portable_baseline.outcome }} | ${{ steps.exact_baseline.outcome }} |
          | dry helpers | ${{ steps.portable_dry.outcome }} | ${{ steps.exact_dry.outcome }} |

          Exact failure remains an exact failure; portable success is a separate result.
          REPORT
      - name: Save comparison reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cpu-checks
          path: |
            ${{ runner.temp }}/vfs-check/*.xml
            ${{ runner.temp }}/vfs-check/*-portable.json
            ${{ runner.temp }}/vfs-check/*-exact.json
            ${{ runner.temp }}/vfs-check/environment.json
            ${{ runner.temp }}/vfs-check/held-suarez.json
            ${{ runner.temp }}/vfs-check/verification-c1/
            ${{ runner.temp }}/vfs-check/verification-energy/
          if-no-files-found: warn
