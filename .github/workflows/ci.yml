name: Fixture CPU investigation (no tolerance changes)
on:
  push:
    branches: [audit/ci-911aada]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4]
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - name: Build unchanged numerical package and reproduce recorded dependencies
        run: |
          python -m pip install -c ci-audit-constraints.txt build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
          python -m pip install -c ci-audit-constraints.txt 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          python -m pip install --prefer-binary -c ci-audit-constraints.txt "${wheels[0]}[test]"
          python -m pip check
          mkdir -p "$RUNNER_TEMP/audit"
          cp -R tests tools examples "$RUNNER_TEMP/audit/"
          python -m pip freeze > "$RUNNER_TEMP/audit/dependencies.txt"
          lscpu > "$RUNNER_TEMP/audit/lscpu.txt"
          cat /proc/cpuinfo > "$RUNNER_TEMP/audit/cpuinfo.txt"
          python -I -c 'import numpy, scipy; numpy.show_config(); scipy.show_config()' > "$RUNNER_TEMP/audit/numerical-libraries.txt"
      - name: Collect every tensor under controlled CPU dispatch
        working-directory: ${{ runner.temp }}/audit
        run: |
          python -I tools/audit_fixture_differences.py --report native.json
          ATEN_CPU_CAPABILITY=avx2 python -I tools/audit_fixture_differences.py --report aten-avx2.json
          ATEN_CPU_CAPABILITY=default python -I tools/audit_fixture_differences.py --report aten-default.json
          MKL_CBWR=COMPATIBLE python -I tools/audit_fixture_differences.py --report mkl-compatible.json
      - name: Existing suite (exact failures retained)
        working-directory: ${{ runner.temp }}/audit
        run: python -I -m pytest tests -q --junitxml=pytest.xml
      - name: Upload evidence regardless of exact result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fixture-audit-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/audit/*.json
            ${{ runner.temp }}/audit/*.txt
            ${{ runner.temp }}/audit/*.xml
