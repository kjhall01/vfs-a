name: Atmospheric carrier reuse verification

on:
  push:
    branches:
      - perf/atmosphere-carrier-reuse-20261123
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install 'gsw==3.6.23'
          python -m pip install --no-deps -r workflows/pyam21/requirements.txt
          python -m pip check
      - name: Verify cloud and bounded moist exact parity
        run: |
          python -I -m pytest tests/test_pyam21_workflow.py -k 'cloud_dynamics or bounded_euler_reports' -q -rA
      - name: Verify full PyAM21 coupling regression
        run: |
          python -I -m pytest tests/test_pyam21_workflow.py -q
