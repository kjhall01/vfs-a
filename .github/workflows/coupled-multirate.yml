name: Coupled multirate scheduler

on:
  push:
    branches:
      - experiment/coupled-multirate-scheduler-20261123
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cadence-and-coupling:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required packages
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m pip install 'gsw==3.6.23'
          python -m pip install --no-deps -r workflows/pyam21/requirements.txt
          python -m pip check
      - name: Verify schedule and live coupled integration
        run: |
          python -I -m pytest tests/test_multirate_schedule.py -q
          python -I -m pytest tests/test_coupled_campaign.py::test_4096_40_multirate_pilot_yaml_is_complete_and_valid tests/test_coupled_campaign.py::test_noncommensurate_process_cadences_fail_closed tests/test_coupled_campaign.py::test_multirate_closures_and_ale_through_actual_coupled_campaign tests/test_coupled_campaign.py::test_explicit_legacy_cadences_reproduce_default_coupled_step tests/test_coupled_campaign.py::test_40_minute_physics_multirate_smoke tests/test_coupled_campaign.py::test_coupled_restart_including_cached_radiation -q
      - name: Equal-model-time small coupled benchmark
        run: |
          python -I -m pytest tests/test_coupled_campaign.py::test_multirate_throughput_paired_small_coupled_case -q -s
